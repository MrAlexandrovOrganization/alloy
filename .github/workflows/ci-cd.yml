name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate configs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting and configuration
        env:
          PROMETHEUS_REMOTE_WRITE_URL: http://127.0.0.1:19090/api/v1/write
        run: make check

  deploy:
    name: Deploy to ${{ matrix.host }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        host: [server, hostkey-russia, hostkey-finland, private-test-server, wsl, asus-server]
    concurrency:
      group: deploy-${{ github.repository }}-${{ matrix.host }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy checked revision and verify service
        run: make ci-deploy
        env:
          DEPLOY_TARGET: ${{ matrix.host }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
